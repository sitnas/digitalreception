# Solo per GitHub Codespaces: tutti i servizi usano la rete della macchina.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    network_mode: host
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00", "--skip-name-resolve", "--bind-address=127.0.0.1", "--mysqlx=OFF"]
    volumes: [db-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      retries: 10
  api:
    build: ./api
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      DB_HOST: 127.0.0.1
      FILES_DIR: /data/files
    depends_on:
      db: { condition: service_healthy }
    volumes: [files:/data/files]
    read_only: true
    tmpfs: [/tmp]
  web:
    build: ./web
    restart: unless-stopped
    network_mode: host
    depends_on: [api]
    volumes: ["./web/deploy/nginx.codespaces.conf:/etc/nginx/conf.d/default.conf:ro"]
volumes:
  db-data:
  files:
