# TLS is terminated upstream (company reverse proxy / load balancer). HTTPS is mandatory:
# the tablet camera and Secure cookies do not work over plain HTTP.
server_tokens off;

upstream reception_api {
  server 127.0.0.1:3000;
  keepalive 16;
}

server {
  listen 8080;
  root /usr/share/nginx/html;

  # Security headers. No third-party origin is allowed anywhere (fonts are bundled).
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location /api/ {
    proxy_pass http://reception_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;                       # tenant is resolved from the host name
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    client_max_body_size 14m;                          # photos + signature, validated again by the API
    proxy_read_timeout 30s;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
